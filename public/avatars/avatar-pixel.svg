  <rect x="268" y="202" width="72" height="46" rx="16" fill="#38BDF8" fill-opacity="0.1" stroke="url(#pxGlass)" stroke-width="4"/>
  <path d="M244 222H268" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
</svg>
