<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="pxBg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060B16"/>
    </radialGradient>
    <radialGradient id="pxHalo" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060B16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pxSkin" cx="42%" cy="34%" r="64%">
