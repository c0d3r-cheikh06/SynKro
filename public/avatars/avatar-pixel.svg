  <ellipse cx="304" cy="226" rx="20" ry="15" fill="#F8FAFC"/>
  <circle cx="210" cy="226" r="11" fill="#2A1205"/>
  <circle cx="302" cy="226" r="11" fill="#2A1205"/>
  <circle cx="210" cy="226" r="6" fill="#090D16"/>
  <circle cx="302" cy="226" r="6" fill="#090D16"/>
