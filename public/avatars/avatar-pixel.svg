  <path d="M186 222C194 210 222 210 230 222" stroke="#090D16" stroke-width="5" stroke-linecap="round"/>
  <path d="M282 222C290 210 318 210 326 222" stroke="#090D16" stroke-width="5" stroke-linecap="round"/>

